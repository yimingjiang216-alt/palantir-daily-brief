name: Palantir AIP 产品深度洞察

on:
  workflow_dispatch:
    inputs:
      feishu_webhook_test:
        description: '可选：测试群 Webhook（填了只发测试群，不消耗正式池未读状态）'
        required: false
        default: ''
      force_run:
        description: '可选：填 true 强制再发一期（忽略今日已发防重检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 拉取最新知识池 (pool.json)
        run: git pull --rebase origin main || true

      - name: 更新知识池并推送今日精读（失败自动重试一次）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_WEBHOOK_TEST: ${{ github.event.inputs.feishu_webhook_test }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: |
          if python src/notify.py; then
            exit 0
          fi
          echo "首次运行失败，等待 60 秒后重试一次…"
          sleep 60
          python src/notify.py

      - name: 提交更新后的知识池与洞察库文档 (pool.json & Palantir产品功能洞察库.md)
        if: success() && github.event.inputs.feishu_webhook_test == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool.json Palantir产品功能洞察库.md 2>/dev/null || git add pool.json
          if git diff --cached --quiet; then
            echo "知识池无变化，无需提交"
            exit 0
          fi
          git commit -m "chore: update pool.json & Palantir产品功能洞察库.md [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "第 $i 次推送失败，5 秒后重试…"
            sleep 5
          done
          echo "::error::知识池推送失败"
          exit 1
