name: Palantir AIP 产品深度洞察

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，每周一至周五运行
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 拉取最新知识池 (pool.json)
        run: git pull --rebase origin main || true

      - name: 更新知识池并推送今日精读
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python src/notify.py

      - name: 提交更新后的知识池 (pool.json)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f pool.json ]; then
            git add pool.json
            git diff --cached --quiet || git commit -m "chore: update pool.json [skip ci]"
            git push origin main || true
          fi
